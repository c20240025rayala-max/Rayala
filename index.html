<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reden.test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Reden</h1>
    <header>
        <nav>
            <span> @Rxyden </span>
            <ul>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="projects">
            <h2 class="projects">My Projects</h2>
            <p> Personal portfolio, Html, websites</p>
        </section>

        <section id="services">
            <h2 id="services">My Services</h2>
            <p>We offer web development and design services.</p>

        </section>

        <section id="contact">
            <h2 id="contact">Lets Build Something Together</h2>
            <form action="#">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
</body>

</html>
